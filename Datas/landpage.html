<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postagens Amorosas</title>
    <link rel="stylesheet" href="postagens.css">
</head>
<body>
    <div class="creationbox">
        <form id="creationform">
            <div class="section">
                <input type="text" id="title" placeholder="Titulo da Postagem" required="true">
                <input type="date" id="data">
            </div>
            <textarea id="descricao" placeholder="Descrição" required="true"></textarea>
            <button type="submit">Publicar</button>
        </form>
    </div>
    <div id="postagens">
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
