<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <div class="loginbox">
        <h4>Insira E-mail e Senha para acessar esta parte do site:</h4>
        <form id="loginform">
            <input type="email" id="mail" placeholder="placeholder@email.com" required="true">
            <input type="password" id="pass" placeholder="senha" required="true">
            <button type="submit">Login</button>
        </form>
    </div>
    <script type="module" src="login.js"></script>
</body>
</html>
