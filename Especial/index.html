<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body id="body">
    <form id="teamo">
        <label for="vezes">Quantas vezes quer que eu escreva eu te amo?</label>
        <input type="number" name="vezes" id="vezes" placeholder="1" min="1">
        <span>Extras:</span>
        <span>
            <input type="checkbox" name="mqt" id="mqt">
            <label for="mqt">mais que tudo</label>
        </span>
        <span>
            <input type="checkbox" name="nm" id="nm">
            <label for="nm">nesse mundo</label>
        </span>
        <span>
            <input type="checkbox" name="ng" id="ng">
            <label for="ng">nessa galáxia</label>
        </span>
        <span>
            <input type="checkbox" name="nu" id="nu">
            <label for="nu">nesse universo</label>
        </span>
        <span>
            <input type="checkbox" name="nmt" id="nmt">
            <label for="nmt">nesse multiverso</label>
        </span>
        <button type="submit">Escrever</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
